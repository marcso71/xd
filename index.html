<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una cartita especial para ti 🎀💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Estilo y colores icónicos de Hello Kitty: Rosas tiernos y blancos */
            background: linear-gradient(135deg, #ffc0cb 0%, #ffb6c1 50%, #ff69b4 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Lazos y corazones flotantes de fondo animados */
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .element {
            position: absolute;
            font-size: 1.8rem;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 35px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            max-width: 480px;
            width: 90%;
            position: relative;
            z-index: 2;
            border: 4px solid #ff69b4;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .decorative-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            animation: bounce 1.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        h1 {
            color: #ff1493;
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
            color: #555;
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 35px;
            min-height: 80px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        #nextBtn {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
        }

        #siBtn {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
        }

        #noBtn {
            background: linear-gradient(135deg, #d8bfd8 0%, #ba55d3 100%);
            color: white;
        }

        #despuesBtn {
            background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 100%);
            color: white;
        }

        .hidden {
            display: none !important;
        }

        #responseModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 45px 35px;
            border-radius: 30px;
            text-align: center;
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
            border: 4px solid #ff1493;
            box-shadow: 0 20px 40px rgba(255, 20, 147, 0.3);
        }

        .modal-content h2 {
            color: #ff1493;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .emoji-display {
            font-size: 4.5rem;
            margin-top: 15px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        @keyframes popUp {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Fondo con elementos animados de Hello Kitty (lazos y corazones) -->
    <div class="floating-elements" id="floatingElements"></div>

    <div class="container" id="mainContainer">
        <div class="decorative-icon" id="mainIcon">🎀</div>
        <h1 id="mainTitle">Hola, hermosa...</h1>
        <p id="mainText">Quería tomarme un momento súper especial para decirte algo que se ha vuelto muy importante para mí...</p>
        <div class="buttons" id="buttonContainer">
            <button id="nextBtn">Continuar 💌</button>
        </div>
    </div>

    <div id="responseModal" class="hidden">
        <div class="modal-content">
            <h2 id="modalText"></h2>
            <div class="emoji-display" id="modalEmoji"></div>
        </div>
    </div>

    <script>
        // Generar lazos y corazones flotantes de Hello Kitty automáticamente
        const elementsContainer = document.getElementById('floatingElements');
        const symbols = ['🎀', '💖', '🍎', '✨', '🐾', '🌸', '🤍'];
        
        for (let i = 0; i < 22; i++) {
            const el = document.createElement('div');
            el.classList.add('element');
            el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            el.style.left = `${Math.random() * 100}%`;
            el.style.top = `${Math.random() * 100}%`;
            el.style.fontSize = `${Math.random() * 1.5 + 1}rem`;
            el.style.animationDuration = `${Math.random() * 4 + 4}s`;
            el.style.animationDelay = `${Math.random() * 3}s`;
            elementsContainer.appendChild(el);
        }

        const mainIcon = document.getElementById('mainIcon');
        const mainTitle = document.getElementById('mainTitle');
        const mainText = document.getElementById('mainText');
        const buttonContainer = document.getElementById('buttonContainer');
        
        const responseModal = document.getElementById('responseModal');
        const modalText = document.getElementById('modalText');
        const modalEmoji = document.getElementById('modalEmoji');

        let paso = 1;

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (paso === 1) {

                paso = 2;
            } else if (paso === 2) {
                mainIcon.textContent = "🍎";
                mainTitle.textContent = "Eres muy especial";
                mainText.textContent = "Tienes una forma de ser tan bonita que ilumina todo a tu alrededor, al igual que las cosas que más me gustan.";
                paso = 3;
            } else if (paso === 3) {
                mainIcon.textContent = "🐾";
                mainTitle.textContent = "Pienso mucho en ti";
                mainText.textContent = "sin importar el dia jamas sales de mi mente, recordarte o saber de ti logra alegrarme por completo el corazón.";
                paso = 4;
            } else if (paso === 4) {
    
                paso = 5;
            } else if (paso === 5) {
                mainIcon.textContent = "💖";
                mainTitle.textContent = "Un detalle con mucho amor";
                mainText.textContent = "Estuve pensando mucho en cómo dar este paso, porque de verdad significas muchísimo para mí.";
                paso = 6;
            } else if (paso === 6) {
                mainIcon.textContent = "🎀";
                mainTitle.textContent = "¿Quieres ser la enebe de este pobre loco?";
                mainText.textContent = "Prometo darte los días más bonitos del mundo con la ternura de un lacito.";
                
                // Cambiar los botones a las 3 opciones finales con emojis de Hello Kitty / temáticos
                buttonContainer.innerHTML = `
                    <button id="siBtn">Sí 🎀</button>
                    <button id="noBtn">No 🥺</button>
                    <button id="despuesBtn">Después ⏳</button>
                `;

                // Agregar los eventos a los nuevos botones
                document.getElementById('siBtn').addEventListener('click', () => mostrarMensaje('🎀'));
                document.getElementById('noBtn').addEventListener('click', () => mostrarMensaje('🥺'));
                document.getElementById('despuesBtn').addEventListener('click', () => mostrarMensaje('🍎'));
            }
        });

        function mostrarMensaje(emoji) {
            modalText.textContent = "Envía este emoji para saber tu respuesta";
            modalEmoji.textContent = emoji;
            responseModal.classList.remove('hidden');
        }
    </script>
</body>
</html>
