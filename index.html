<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Alison ✨</title>
    <!-- Fuentes bonitas de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- Estilos Generales y Fondo Animado --- */
        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        /* Animación de los corazones flotantes */
        .heart {
            position: absolute;
            top: -10%;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* --- La Tarjeta Central --- */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15), 0 0 0 2px rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        /* Título: Para Alison */
        h1 {
            font-family: 'Dancing Script', cursive;
            color: #c72185;
            font-size: 45px;
            margin-bottom: 10px;
            margin-top: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitulo {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Área del mensaje */
        .mensaje-contenedor {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        p {
            font-size: 18px;
            color: #444;
            line-height: 1.6;
            margin: 0;
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
        }
        
        p.fade-out {
            opacity: 0;
        }

        /* El Botón */
        button {
            background: linear-gradient(45deg, #db2777, #ec4899);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 5px 15px rgba(219, 39, 119, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(219, 39, 119, 0.6);
            background: linear-gradient(45deg, #ec4899, #db2777);
        }

        button:active {
            transform: translateY(1px);
        }

        @media (max-width: 600px) {
            .card { padding: 30px; }
            h1 { font-size: 36px; }
            p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="fondo-corazones"></div>

    <div class="card">
        <h1>Para: Alison</h1>
        <div class="subtitulo">Un detalle porque te quiero</div>
        
        <div class="mensaje-contenedor">
            <p id="mensaje">Presiona el botón...</p>
        </div>
        
        <button id="boton" onclick="siguienteMensaje()">Siguiente ✨</button>
    </div>

    <script>
        // Mensajes centrados puramente en el afecto y la distancia
        const mensajes = [
            "Hola bb. Quería recordarte lo muchísimo que te quiero, sin importar los kilómetros que nos separen.",
            "siempre al despetar o durante el dia espero cada mensaje tuyo porque hace mi dia feliz.",
            "tambien queria recorte que siempre seras mi pensamiento favorito antes de dormir, en mi sueños y el primero al despertar.",
            "Eres una persona sumamente especial para mí, con una luz única que siempre logra alegrarme.",
            "Te quiero con todo mi corazón BB. Gracias por estar siempre, incluso a la distancia. 💖"
        ];

        let indice = 0;
        const parrafoMensaje = document.getElementById("mensaje");
        const boton = document.getElementById("boton");

        function siguienteMensaje() {
            parrafoMensaje.classList.add('fade-out');

            setTimeout(() => {
                if (indice < mensajes.length) {
                    parrafoMensaje.innerText = mensajes[indice];
                    indice++;
                } else {
                    parrafoMensaje.innerHTML = "Te quiero muchísimo bb. Siempre te amare sin importar que. ✨<br><br><strong>Con todo mi amor.</strong>";
                    boton.style.display = "none";
                }
                parrafoMensaje.classList.remove('fade-out');
            }, 500);
        }

        function crearCorazon() {
            const corazon = document.createElement('div');
            corazon.classList.add('heart');
            corazon.innerHTML = '&#9829;';
            
            corazon.style.left = Math.random() * 100 + 'vw';
            corazon.style.animationDuration = Math.random() * 6 + 4 + 's';
            corazon.style.fontSize = Math.random() * 15 + 15 + 'px';
            corazon.style.opacity = Math.random() * 0.5 + 0.2;

            document.getElementById('fondo-corazones').appendChild(corazon);

            setTimeout(() => {
                corazon.remove();
            }, 10000);
        }

        setInterval(crearCorazon, 300);
    </script>

</body>
</html>
